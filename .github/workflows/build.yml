name: 'Unzip and build RedFlare jar'
# Drop this file at .github/workflows/build.yml in a repo that also has
# the project's .zip file (RedFlare-source.zip) sitting in the repo root.
# On every push (or manual "Run workflow" from the Actions tab), this
# unzips it, finds the Gradle project inside, builds it, and uploads the
# resulting jar as a downloadable artifact. No secrets/tokens needed.
#
# This project bundles the real paper-api-26.1.2.build.74-stable.jar
# (extracted directly from your own server jar) in its libs/ folder and
# compiles against that local file - it does NOT need to reach
# repo.papermc.io at all. It only needs normal internet access to fetch
# Gradle itself and any standard Java/Gradle plugins, which GitHub-hosted
# runners have by default.
#
# NOTE: this project has no Gradle wrapper checked in, so this workflow
# installs Gradle directly via gradle/actions/setup-gradle instead of
# calling ./gradlew.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in the repo root!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: project
        run: gradle build --no-daemon

      - name: Inspect built jar (no fake Bukkit/Paper classes, correct manifest)
        working-directory: project
        run: |
          JAR=$(find build/libs -iname "*.jar" | head -n 1)
          echo "=== Jar: $JAR ==="
          echo "--- plugin.yml ---"
          unzip -p "$JAR" plugin.yml
          echo "--- class list (should be ONLY com/yourserver/redflare/*, no org/bukkit or io/papermc) ---"
          unzip -l "$JAR"

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: RedFlare-jar
          path: project/build/libs/*.jar
